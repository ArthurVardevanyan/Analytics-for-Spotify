---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: analytics-for-spotify-cert
  namespace: analytics-for-spotify-ext
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretName: analytics-for-spotify-cert
  duration: 1080h # 45d
  renewBeforePercentage: 50
  privateKey:
    rotationPolicy: Always
    algorithm: ECDSA
    size: 256
  dnsNames:
    - "analytics-for-spotify.arthurvardevanyan.com"
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
